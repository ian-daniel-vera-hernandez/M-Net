<!DOCTYPE html>

<body class="bg-body d-flex flex-column min-vh-100">

        <button class="btn btn-link text-white p-0" id="bd-theme-toggle" type="button" aria-expanded="false">
          <svg class="bi theme-icon-active icono-luna" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">

  <main class="container-fluid flex-grow-1 d-flex justify-content-center align-items-center pt-5 mt-5">
    
    <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%; border-radius: 1rem;">
      <div class="card-body p-5">
        
        <div class="text-center mb-4">
          <h2 class="fw-bold mb-2">Acceso a <span class="texto-destacado">M-Net</span></h2>
          <p class="text-secondary">Ingresa tus credenciales para continuar</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
          Correo o contraseña incorrectos.
        </div>

        <form id="loginForm">
          <div class="mb-4">
            <label for="emailInput" class="form-label fw-bold">Correo Electrónico</label>
            <input type="email" class="form-control form-control-lg bg-body" id="emailInput" placeholder="usuario@empresa.com" required>
          </div>
          
          <div class="mb-5">
            <label for="passwordInput" class="form-label fw-bold">Contraseña</label>
            <input type="password" class="form-control form-control-lg bg-body" id="passwordInput" placeholder="********" required>
          </div>

          <button type="submit" id="btnSubmit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" style="background-color: #1B2A6D; border: none;">
            Iniciar Sesión
          </button>
        </form>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // =========================================================
    // ⚠️ REEMPLAZA ESTO CON TUS DATOS REALES DE SUPABASE ⚠️
    // =========================================================
    const SUPABASE_URL = 'https://exzjdesnqcjdloebpwth.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4empkZXNucWNqZGxvZWJwd3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MzY5OTAsImV4cCI6MjA4NzIxMjk5MH0.FHUiqpGbj_U_8zfb4i_BmmVQ-RN6ofQyCW27u74Ooz8';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const errorAlert = document.getElementById('errorAlert');
    const btnSubmit = document.getElementById('btnSubmit');

    // =========================================================
    // REPLICA DE LA FUNCIÓN DE JAVA: hashearContrasena()
    // =========================================================
    async function hashearContrasena(password) {
      // Convertimos el string a bytes (equivalente a password.getBytes("UTF-8") en Java)
      const msgBuffer = new TextEncoder().encode(password);
      
      // Aplicamos el hash SHA-256 (equivalente a MessageDigest en Java)
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      
      // Convertimos los bytes a una cadena Hexadecimal
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      
      return hashHex;
    }

    // Escuchar cuando el usuario envíe el formulario
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Conectando...';
      errorAlert.classList.add('d-none');

      const email = emailInput.value;
      const passwordPlana = passwordInput.value;

      try {
        // Encriptamos la contraseña tal como lo hace Java
        const passwordEncriptada = await hashearContrasena(passwordPlana);

        // Hacemos la consulta a tu tabla pública 'usuarios'
        const { data, error } = await supabase
          .from('usuarios')
          .select('*')
          .eq('correo', email)
          .eq('contrasena', passwordEncriptada);

        if (error) throw error;

       // Validamos si la base de datos devolvió algún registro
        if (data && data.length > 0) {
          const usuarioEncontrado = data[0];
          console.log('¡Acceso autorizado!', usuarioEncontrado);
          
          // Guardamos los datos de la sesión para usarlos después
          localStorage.setItem('usuarioMNet', JSON.stringify(usuarioEncontrado));
          
          // Redirigimos al index
          window.location.href = 'index.html'; 
        } else {
          throw new Error('Credenciales inválidas');
        }

      } catch (error) {
        console.error('Error de login:', error.message);
        errorAlert.textContent = 'Correo o contraseña incorrectos.';
        errorAlert.classList.remove('d-none');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>

</html>
